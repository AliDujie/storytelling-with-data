[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storytelling-with-data-skill"
version = "2.2.31"
description = "Storytelling with Data toolkit — professional data visualization and narrative based on Cole Nussbaumer Knaflic's framework (基于《Storytelling with Data》全书构建的专业数据可视化与数据叙事工具包)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "AliDujie"}]
keywords = ["data-visualization", "storytelling", "data-narrative", "chart-design", "openclaw-skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
]

[project.urls]
Homepage = "https://github.com/AliDujie/storytelling-with-data"
Repository = "https://github.com/AliDujie/storytelling-with-data"
Issues = "https://github.com/AliDujie/storytelling-with-data/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
include = ["swd*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
